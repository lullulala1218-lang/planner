        background: var(--surface-alt); border: 1px solid var(--border); color: var(--text);
        border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: var(--font-kr); outline: none; width: 100%;
      }
      .sn-input:focus, .sn-select:focus { border-color: var(--amber); }
      .sn-input::placeholder { color: var(--text-faint); }
      .sn-btn {
        background: var(--amber); color: #ffffff; font-weight: 700; border: none; border-radius: 8px;
        padding: 9px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 14px;
        transition: filter .15s ease; white-space: nowrap;
      }
      .sn-btn:hover { filter: brightness(1.08); }
      .sn-btn-ghost {
        background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px;
        padding: 6px 12px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 4px;
      }
      .sn-btn-ghost:hover { border-color: var(--amber); color: var(--amber); }
      .sn-icon-btn {
        background: transparent; border: none; color: var(--text-faint); cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; padding: 5px; border-radius: 6px; flex-shrink: 0;
      }
      .sn-icon-btn:hover { color: var(--coral); background: rgba(156,75,45,0.12); }
      .sn-tab {
        display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 10px;
        cursor: pointer; border: 1px solid transparent; color: var(--text-faint); flex: 1; min-width: 0; background: transparent;
      }
      .sn-tab .sn-tab-num { font-family: var(--font-mono); font-size: 17px; line-height: 1; }
      .sn-tab .sn-tab-label { font-size: 11px; white-space: nowrap; }
      .sn-tab.active { color: var(--amber); background: var(--amber-dim); border-color: rgba(194,59,46,0.30); }
      .sn-tab:hover:not(.active) { color: var(--text-muted); }
      .sn-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
      .sn-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
      .sn-dday-del { opacity: 0; transition: opacity .15s ease; }
      .sn-dday-wrap:hover .sn-dday-del, .sn-dday-wrap:focus-within .sn-dday-del { opacity: 1; }
      .sn-dday-dropdown {
        opacity: 0; visibility: hidden; transform: translateY(-4px);
        transition: opacity .15s ease, transform .15s ease, visibility .15s ease;
        pointer-events: none;
      }
      .sn-dday-wrap:hover .sn-dday-dropdown, .sn-dday-wrap:focus-within .sn-dday-dropdown {
        opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto;
      }
      .sn-dday-row-del { opacity: 0; transition: opacity .15s ease; }
      .sn-dday-row:hover .sn-dday-row-del { opacity: 1; }
      .sn-dday-row:hover { background: var(--surface-alt); }
      @media (max-width: 640px) {
        .sn-tab .sn-tab-label { display: none; }
      }
      .sn-container { max-width: 880px; }
      .sn-timetable-columns { display: flex; flex-direction: column; gap: 16px; }
      .sn-cal-cell { min-height: 48px; padding: 6px 2px; }
      .sn-cal-daynum { font-size: 12px; }
      @media (min-width: 900px) {
        .sn-container { max-width: 1120px; }
        .sn-timetable-columns { flex-direction: row; align-items: flex-start; }
        .sn-timetable-columns > .sn-calendar-col { flex: 1 1 56%; }
        .sn-timetable-columns > .sn-detail-col { flex: 1 1 44%; position: sticky; top: 12px; }
        .sn-cal-cell { min-height: 66px; padding: 10px 4px; }
        .sn-cal-daynum { font-size: 14px; }
      }
      .sn-dday-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; }
      .sn-grades-columns { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 12px; }
      .sn-grades-columns > .sn-grades-left { flex: 1 1 240px; border-right: 1px solid var(--border); padding-right: 22px; }
      .sn-grades-columns > .sn-grades-right { flex: 1 1 220px; min-width: 0; }
      @media (max-width: 520px) {

      }
